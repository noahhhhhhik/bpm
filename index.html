<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM & BPS Counter</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .display { font-size: 4rem; margin: 20px; color: #00ffcc; }
        .label { font-size: 1.2rem; color: #888; }
        button { padding: 20px 40px; font-size: 1.5rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 10px; margin: 10px; }
        button:active { background: #0056b3; transform: scale(0.98); }
        .audio-box { border: 2px dashed #444; padding: 20px; margin-top: 40px; border-radius: 15px; }
        #visualizer { width: 100%; height: 50px; background: #222; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>BPM Counter</h1>
    
    <div class="label">Beats Per Minute</div>
    <div id="bpm-display" class="display">0</div>
    
    <div class="label">Beats Per Second (BPS)</div>
    <div id="bps-display" style="font-size: 2rem; color: #00ffcc;">0.0</div>

    <button id="tap-btn">HIER TIPPEN</button>
    <button id="reset-btn" style="background: #666;">Reset</button>

    <div class="audio-box">
        <h3>Auto-Erkennung (Mikrofon)</h3>
        <button id="start-audio" style="background: #28a745;">Mikrofon starten</button>
        <div id="visualizer"></div>
        <p id="audio-status">Warte auf Audio...</p>
    </div>

    <script>
        // Variablen für Manuelles Tapping
        let taps = [];
        const bpmDisplay = document.getElementById('bpm-display');
        const bpsDisplay = document.getElementById('bps-display');

        document.getElementById('tap-btn').addEventListener('click', () => {
            const now = Date.now();
            taps.push(now);
            
            if (taps.length > 1) {
                if (taps.length > 10) taps.shift(); // Nur die letzten 10 Taps nutzen
                
                let intervals = [];
                for (let i = 1; i < taps.length; i++) {
                    intervals.push(taps[i] - taps[i-1]);
                }
                
                const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const bpm = Math.round(60000 / avgInterval);
                const bps = (1000 / avgInterval).toFixed(2);
                
                bpmDisplay.innerText = bpm;
                bpsDisplay.innerText = bps;
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            taps = [];
            bpmDisplay.innerText = "0";
            bpsDisplay.innerText = "0.0";
        });

        // --- Audio Analyse (Beat Detection) ---
        let audioCtx, analyser, source;
        const startAudioBtn = document.getElementById('start-audio');

        startAudioBtn.addEventListener('click', async () => {
            if (audioCtx) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                let lastBeat = 0;
                const threshold = 180; // Empfindlichkeit für laute Impulse

                function detect() {
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Wir schauen uns die tiefen Frequenzen (Bass) an
                    let volume = dataArray[1] + dataArray[2] + dataArray[3]; 
                    let avgVolume = volume / 3;

                    if (avgVolume > threshold) {
                        const now = Date.now();
                        if (now - lastBeat > 250) { // Mindestabstand zwischen Beats (max 240 BPM)
                            document.getElementById('tap-btn').click(); // Simuliere Tap
                            lastBeat = now;
                            document.body.style.backgroundColor = "#1a3a3a";
                            setTimeout(() => document.body.style.backgroundColor = "#121212", 100);
                        }
                    }
                    requestAnimationFrame(detect);
                }
                
                detect();
                startAudioBtn.innerText = "Mikrofon aktiv";
                startAudioBtn.disabled = true;
                document.getElementById('audio-status').innerText = "Höre zu... Klatsche oder spiele Musik!";
                
            } catch (err) {
                console.error("Mikrofon-Fehler:", err);
                alert("Mikrofon wurde abgelehnt oder nicht gefunden.");
            }
        });
    </script>
</body>
</html>
