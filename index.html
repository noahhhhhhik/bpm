<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM Studio Pro + Spotify</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 3px solid #1db954; color: #1db954; } /* Spotify Green */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .spotify-btn { background-color: #1db954; color: black; font-weight: bold; border-radius: 9999px; transition: 0.3s; }
        .spotify-btn:hover { background-color: #1ed760; transform: scale(1.05); }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 pt-4">
            <h1 class="text-xl font-black italic">BPM<span class="text-emerald-500">STUDIO</span></h1>
            <div id="bpm-master" class="text-4xl font-mono font-bold text-emerald-400">0</div>
        </header>

        <!-- Navigation -->
        <nav class="flex border-b border-slate-800 mb-8 overflow-x-auto text-[10px] uppercase tracking-tighter">
            <button onclick="openTab('tap')" class="tab-link active-tab px-4 py-3 font-bold">Tap/Mic</button>
            <button onclick="openTab('file')" class="tab-link px-4 py-3 font-bold">Datei</button>
            <button onclick="openTab('itunes')" class="tab-link px-4 py-3 font-bold">iTunes</button>
            <button onclick="openTab('spotify')" class="tab-link px-4 py-3 font-bold">Spotify</button>
        </nav>

        <!-- TAB 1: TAP & MIC -->
        <div id="tap" class="tab-content active space-y-6">
            <button id="tap-btn" class="w-full py-20 glass rounded-3xl text-6xl font-black active:scale-95 transition-all">TAP</button>
            <div class="glass p-6 rounded-3xl">
                <div class="flex justify-between items-center mb-4 text-xs font-bold text-slate-400">
                    <span>BASS-ERKENNUNG</span>
                    <button id="mic-toggle" class="bg-emerald-500 px-4 py-1 rounded-full text-slate-900">START</button>
                </div>
                <input type="range" id="sensitivity" min="100" max="255" value="200" class="w-full accent-emerald-500">
            </div>
        </div>

        <!-- TAB 2: FILE -->
        <div id="file" class="tab-content">
            <div class="glass p-10 rounded-3xl border-dashed border-2 border-slate-600 text-center">
                <input type="file" id="file-input" accept="audio/*" class="hidden">
                <label for="file-input" class="cursor-pointer block">
                    <span class="text-4xl mb-4 block">📂</span>
                    <p class="font-bold">Musikdatei analysieren</p>
                </label>
            </div>
            <div id="file-status" class="mt-4 text-center text-emerald-400 font-mono text-sm"></div>
        </div>

        <!-- TAB 3: ITUNES -->
        <div id="itunes" class="tab-content space-y-4">
            <div class="flex gap-2">
                <input type="text" id="itunes-query" placeholder="iTunes Suche..." class="flex-1 bg-slate-800 p-4 rounded-2xl focus:outline-none border border-slate-700">
                <button onclick="searchITunes()" class="bg-slate-700 px-6 rounded-2xl">Go</button>
            </div>
            <div id="itunes-results" class="space-y-2"></div>
        </div>

        <!-- TAB 4: SPOTIFY -->
        <div id="spotify" class="tab-content space-y-4 text-center">
            <div id="spotify-login-section">
                <p class="text-sm text-slate-400 mb-4">Um Spotify zu nutzen, musst du dich einmalig verbinden.</p>
                <button onclick="loginSpotify()" class="spotify-btn px-8 py-3">Mit Spotify verbinden</button>
            </div>
            <div id="spotify-search-section" class="hidden space-y-4">
                <div class="flex gap-2 text-left">
                    <input type="text" id="spotify-query" placeholder="Spotify Song-Suche..." class="flex-1 bg-slate-800 p-4 rounded-2xl focus:outline-none border border-slate-700">
                    <button onclick="searchSpotify()" class="spotify-btn px-6 py-2 text-sm text-slate-900">Go</button>
                </div>
                <div id="spotify-results" class="space-y-2 text-left"></div>
            </div>
        </div>

        <button onclick="resetBpm()" class="w-full mt-10 text-[10px] text-slate-600 uppercase tracking-widest">Reset Master BPM</button>
    </div>

    <script>
        // --- KONFIGURATION ---
        const CLIENT_ID = 'DEINE_SPOTIFY_CLIENT_ID'; // <--- HIER DEINE ID EINTRAGEN
        const REDIRECT_URI = window.location.origin + '/'; 

        let taps = [];
        let globalBpm = 0;
        let spotifyToken = null;

        // AUTH CHECK (Prüfen ob Token in URL nach Login)
        window.onload = () => {
            const hash = window.location.hash.substring(1).split('&').reduce((initial, item) => {
                if (item) { var parts = item.split('='); initial[parts[0]] = decodeURIComponent(parts[1]); }
                return initial;
            }, {});
            if (hash.access_token) {
                spotifyToken = hash.access_token;
                window.location.hash = ""; // Clean URL
                showSpotifySearch();
            }
        };

        function openTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active-tab'));
            document.getElementById(name).classList.add('active');
            event.currentTarget.classList.add('active-tab');
        }

        // BPM LOGIC
        function updateBpm(val) {
            globalBpm = val;
            document.getElementById('bpm-master').innerText = Math.round(val);
        }

        function handleTap() {
            const now = Date.now();
            if (taps.length > 0 && now - taps[taps.length-1] > 2000) taps = [];
            taps.push(now);
            if (taps.length > 1) {
                const avg = (taps[taps.length-1] - taps[0]) / (taps.length-1);
                updateBpm(60000 / avg);
            }
        }
        document.getElementById('tap-btn').addEventListener('mousedown', (e) => { e.preventDefault(); handleTap(); });

        // SPOTIFY LOGIC
        function loginSpotify() {
            const scope = 'user-read-private user-read-email';
            const url = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}&response_type=token&show_dialog=true`;
            window.location.href = url;
        }

        function showSpotifySearch() {
            document.getElementById('spotify-login-section').classList.add('hidden');
            document.getElementById('spotify-search-section').classList.remove('hidden');
        }

        async function searchSpotify() {
            const q = document.getElementById('spotify-query').value;
            const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=10`, {
                headers: { 'Authorization': 'Bearer ' + spotifyToken }
            });
            const data = await res.json();
            renderResults('spotify-results', data.tracks.items, 'spotify');
        }

        // ITUNES LOGIC
        async function searchITunes() {
            const q = document.getElementById('itunes-query').value;
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=10`);
            const data = await res.json();
            renderResults('itunes-results', data.results, 'itunes');
        }

        function renderResults(targetId, tracks, type) {
            const container = document.getElementById(targetId);
            container.innerHTML = "";
            tracks.forEach(t => {
                const name = t.name || t.trackName;
                const artist = (t.artists ? t.artists[0].name : t.artistName);
                const img = (t.album ? t.album.images[2].url : t.artworkUrl60);
                const preview = t.preview_url || t.previewUrl;

                const div = document.createElement('div');
                div.className = "glass p-3 rounded-2xl flex items-center gap-4 animate-fadeIn";
                div.innerHTML = `
                    <img src="${img}" class="w-12 h-12 rounded-lg">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm truncate">${name}</p>
                        <p class="text-[10px] text-slate-500 truncate">${artist}</p>
                    </div>
                    <button onclick="playSong('${preview}')" class="bg-emerald-500/20 text-emerald-500 p-2 rounded-full text-xs">▶️</button>
                `;
                container.appendChild(div);
            });
        }

        let player = null;
        function playSong(url) {
            if (!url || url === "null") { alert("Keine Hörprobe verfügbar."); return; }
            if (player) player.pause();
            player = new Audio(url);
            player.play();
            openTab('tap');
        }

        function resetBpm() { taps = []; updateBpm(0); }
    </script>
</body>
</html>
