<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPM Counter Pro V2</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; touch-action: manipulation; }
        .active-glow { box-shadow: 0 0 20px rgba(14, 165, 233, 0.5); }
        .beat-flash { animation: flash 0.15s ease-out; }
        @keyframes flash { 0% { background-color: #1e293b; } 50% { background-color: #334155; } 100% { background-color: #1e293b; } }
        input[type=range] { width: 100%; accent-color: #0ea5e9; }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-4">

    <div id="main-card" class="max-w-md w-full p-8 bg-slate-800 rounded-[2.5rem] shadow-2xl border border-slate-700 text-center transition-all">
        <h1 class="text-xs font-black tracking-[0.3em] text-slate-500 mb-8 uppercase">BPM & BPS Monitor V2</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-10">
            <div class="bg-slate-900/50 p-6 rounded-3xl">
                <div id="bpm-display" class="text-5xl font-bold text-sky-400">0</div>
                <div class="text-[10px] text-slate-500 uppercase mt-2 font-bold">BPM</div>
            </div>
            <div class="bg-slate-900/50 p-6 rounded-3xl">
                <div id="bps-display" class="text-5xl font-bold text-amber-400">0.0</div>
                <div class="text-[10px] text-slate-500 uppercase mt-2 font-bold">BPS</div>
            </div>
        </div>

        <button id="tap-btn" class="w-full py-14 bg-sky-500 text-slate-900 text-4xl font-black rounded-3xl shadow-lg transition-all active:scale-95 select-none mb-6">
            TAP
        </button>

        <div class="bg-slate-900/80 p-5 rounded-2xl mb-6 text-left">
            <label class="text-[10px] uppercase font-bold text-slate-500 block mb-2">Empfindlichkeit (Bass)</label>
            <input type="range" id="sensitivity" min="100" max="250" value="180">
            <div class="flex justify-between text-[10px] text-slate-600 mt-1">
                <span>Empfindlich</span>
                <span>Nur harter Bass</span>
            </div>
        </div>

        <div class="flex gap-2">
            <button id="mic-toggle" class="flex-1 py-4 bg-slate-700 text-white font-bold rounded-2xl transition-all hover:bg-slate-600 flex items-center justify-center gap-2">
                <span id="mic-icon">🎤</span> <span id="mic-text">Mikro starten</span>
            </button>
            <button id="reset-btn" class="px-6 py-4 bg-slate-900 text-slate-400 rounded-2xl hover:text-white transition-all">
                ↺
            </button>
        </div>
        
        <p id="status" class="mt-4 text-xs text-slate-500 italic">Bereit zum Messen</p>
    </div>

    <script>
        let taps = [];
        let audioCtx = null;
        let stream = null;
        let analyser = null;
        let isMicRunning = false;
        let animationId = null;
        
        const bpmDisplay = document.getElementById('bpm-display');
        const bpsDisplay = document.getElementById('bps-display');
        const tapBtn = document.getElementById('tap-btn');
        const micToggle = document.getElementById('mic-toggle');
        const micText = document.getElementById('mic-text');
        const status = document.getElementById('status');
        const mainCard = document.getElementById('main-card');
        const sensitivitySlider = document.getElementById('sensitivity');

        function processTap() {
            const now = Date.now();
            // Timeout nach 2 Sekunden ohne Tap
            if (taps.length > 0 && now - taps[taps.length - 1] > 2000) taps = [];
            
            taps.push(now);
            if (taps.length > 15) taps.shift();

            if (taps.length > 1) {
                const avgInterval = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
                bpmDisplay.innerText = Math.round(60000 / avgInterval);
                bpsDisplay.innerText = (1000 / avgInterval).toFixed(1);
            }
            
            mainCard.classList.add('beat-flash');
            setTimeout(() => mainCard.classList.remove('beat-flash'), 100);
        }

        async function toggleMic() {
            if (isMicRunning) stopMic();
            else startMic();
        }

        async function startMic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                
                // Low-Pass Filter hinzufügen, um hohe Töne (Stimmen, Snares) zu entfernen
                const filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 150; // Nur Frequenzen unter 150Hz durchlassen (Bass)
                
                source.connect(filter);
                filter.connect(analyser);

                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.3; // Macht die Erkennung stabiler

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                let lastBeatTime = 0;
                isMicRunning = true;
                
                micToggle.classList.replace('bg-slate-700', 'bg-red-500/20');
                micToggle.classList.add('text-red-500', 'border', 'border-red-500/50');
                micText.innerText = "Stoppen";
                status.innerText = "Bass-Erkennung läuft...";

                function detect() {
                    if (!isMicRunning) return;
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Wir messen nur die Energie im tiefsten Bassbereich
                    let bassEnergy = dataArray[1] + dataArray[2] + dataArray[3]; 
                    let threshold = parseInt(sensitivitySlider.value);

                    if (bassEnergy > threshold) {
                        const now = Date.now();
                        // "Hold-off" Zeit: Verhindert Mehrfach-Trigger bei einem einzigen Schlag
                        // 300ms entspricht max. 200 BPM.
                        if (now - lastBeatTime > 300) { 
                            processTap();
                            lastBeatTime = now;
                        }
                    }
                    animationId = requestAnimationFrame(detect);
                }
                detect();
            } catch (err) {
                alert("Mikrofon-Fehler: " + err);
            }
        }

        function stopMic() {
            isMicRunning = false;
            cancelAnimationFrame(animationId);
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (audioCtx) audioCtx.close();
            
            micToggle.classList.replace('bg-red-500/20', 'bg-slate-700');
            micToggle.classList.remove('text-red-500', 'border', 'border-red-500/50');
            micText.innerText = "Mikro starten";
            status.innerText = "Beendet.";
        }

        tapBtn.addEventListener('mousedown', (e) => { e.preventDefault(); processTap(); });
        micToggle.addEventListener('click', toggleMic);
        document.getElementById('reset-btn').addEventListener('click', () => {
            taps = [];
            bpmDisplay.innerText = "0";
            bpsDisplay.innerText = "0.0";
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
