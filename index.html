<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPM Studio Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-link.active { border-bottom: 3px solid #0ea5e9; color: #0ea5e9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .bpm-glow { text-shadow: 0 0 20px rgba(14, 165, 233, 0.7); }
        .dot { transition: all 0.1s; }
        .dot-active { background-color: #38bdf8 !important; transform: scale(1.4); box-shadow: 0 0 15px #38bdf8; }
        input[type=range] { accent-color: #0ea5e9; }
    </style>
</head>
<body class="p-4 pb-32 select-none">

    <div class="max-w-xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pt-6">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter uppercase">BPM<span class="text-sky-500">PRECISION</span></h1>
                <p id="status-text" class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">V3 Stabile Version</p>
            </div>
            <div class="text-right flex items-center gap-3">
                <div id="beat-dot" class="w-3 h-3 rounded-full bg-slate-700 dot"></div>
                <div id="bpm-display" class="text-5xl font-mono font-black text-sky-400 bpm-glow">0</div>
                <div class="flex flex-col gap-1">
                    <button onclick="adjustBpm(0.5)" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded border border-slate-700">÷2</button>
                    <button onclick="adjustBpm(2)" class="bg-slate-800 text-[10px] px-2 py-0.5 rounded border border-slate-700">x2</button>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="flex border-b border-slate-800 mb-8 text-[11px] font-bold uppercase">
            <button id="link-tap" onclick="openTab('tap')" class="tab-link active flex-1 py-4">Tap / Live</button>
            <button id="link-file" onclick="openTab('file')" class="tab-link flex-1 py-4">Dateien</button>
            <button id="link-search" onclick="openTab('search')" class="tab-link flex-1 py-4">Suche</button>
        </nav>

        <!-- TAB 1: TAP -->
        <div id="tab-tap" class="tab-content active space-y-6">
            <button id="tap-btn" class="w-full py-20 glass rounded-[3rem] text-7xl font-black active:scale-95 transition-all border-2 border-slate-700/50 shadow-2xl">TAP</button>
            
            <div class="glass p-6 rounded-[2rem] border border-slate-700">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest font-bold">Automatik (Mikro)</span>
                    <button id="mic-toggle" class="bg-sky-500 text-slate-900 px-6 py-2 rounded-full text-[10px] font-black uppercase">Start</button>
                </div>
                <input type="range" id="sensitivity" min="1.1" max="3.0" step="0.1" value="1.6" class="w-full h-2 bg-slate-900 rounded-lg appearance-none">
                <div class="flex justify-between text-[9px] text-slate-600 mt-2 font-bold uppercase italic"><span>Empfindlich</span><span>Nur Kickdrum</span></div>
            </div>
            <button onclick="resetBpm()" class="w-full text-slate-600 text-[10px] font-bold uppercase tracking-widest">✕ Reset</button>
        </div>

        <!-- TAB 2: FILES -->
        <div id="tab-file" class="tab-content space-y-4">
            <div class="glass p-12 rounded-[2rem] border-dashed border-2 border-slate-700 text-center relative">
                <input type="file" id="file-input" accept="audio/*" class="absolute inset-0 opacity-0 cursor-pointer">
                <p class="font-bold text-slate-300">Musikdatei laden</p>
            </div>
            <div id="file-list" class="space-y-2"></div>
        </div>

        <!-- TAB 3: SEARCH -->
        <div id="tab-search" class="tab-content space-y-4">
            <div class="flex gap-2">
                <input type="text" id="itunes-q" placeholder="Song suchen..." class="flex-1 bg-slate-800 p-4 rounded-2xl focus:outline-none border border-slate-700">
                <button onclick="searchSongs()" class="bg-sky-500 text-slate-900 px-6 rounded-2xl font-black text-xs uppercase">Go</button>
            </div>
            <div id="itunes-results" class="space-y-2"></div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div id="player-bar" class="fixed bottom-0 left-0 right-0 glass border-t border-slate-700 p-5 translate-y-full transition-transform duration-300 z-50 rounded-t-[2rem]">
        <div class="max-w-xl mx-auto flex items-center gap-4">
            <div id="player-art" class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-xl">🎵</div>
            <div class="flex-1 min-w-0">
                <p id="player-title" class="font-bold text-sm truncate">Titel</p>
                <p id="player-sub" class="text-[10px] text-slate-500 truncate">Artist</p>
            </div>
            <button id="stop-btn" class="bg-red-500/20 text-red-500 px-6 py-3 rounded-xl font-black text-[10px] uppercase">STOP</button>
        </div>
    </div>

    <script>
        let taps = [];
        let audioCtx = null, analyser = null, activeAudio = null, isMicRunning = false, micStream = null;
        let runningEnergy = 0;

        // TABS: Stabiler ohne Event-Abhängigkeit
        function openTab(tabId) {
            // Alle Inhalte verstecken
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            // Alle Links deaktivieren
            document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
            
            // Aktiven Tab zeigen
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('link-' + tabId).classList.add('active');
        }

        function triggerVisualBeat() {
            const dot = document.getElementById('beat-dot');
            dot.classList.add('dot-active');
            setTimeout(() => dot.classList.remove('dot-active'), 60);
        }

        function processBeat() {
            const now = Date.now();
            if (taps.length > 0 && now - taps[taps.length - 1] > 2500) taps = [];
            taps.push(now);
            if (taps.length > 15) taps.shift();
            if (taps.length > 1) {
                const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
                document.getElementById('bpm-display').innerText = Math.round(60000 / avg);
            }
            triggerVisualBeat();
        }

        function adjustBpm(factor) {
            const display = document.getElementById('bpm-display');
            let val = parseInt(display.innerText);
            if(val > 0) {
                display.innerText = Math.round(val * factor);
                taps = []; // Reset für neue Zählung
            }
        }

        function resetBpm() {
            taps = [];
            document.getElementById('bpm-display').innerText = "0";
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 90; // Tieferer Filter für Kickdrum
                filter.connect(analyser);

                const data = new Uint8Array(analyser.frequencyBinCount);
                let lastBeat = 0;

                const loop = () => {
                    analyser.getByteFrequencyData(data);
                    let energy = data[1] + data[2] + data[3]; // Bass-Energie
                    runningEnergy = runningEnergy * 0.92 + energy * 0.08; // Dynamischer Durchschnitt

                    let sens = parseFloat(document.getElementById('sensitivity').value);
                    if (energy > runningEnergy * sens && energy > 40) {
                        const now = Date.now();
                        if (now - lastBeat > 320) { // Sperrzeit gegen Doppel-Trigger
                            processBeat();
                            lastBeat = now;
                        }
                    }
                    requestAnimationFrame(loop);
                };
                loop();
            }
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        }

        function playTrack(url, title, artist, img = null) {
            initAudio().then(() => {
                if (activeAudio) activeAudio.pause();
                activeAudio = new Audio(url);
                activeAudio.crossOrigin = "anonymous";
                const source = audioCtx.createMediaElementSource(activeAudio);
                source.connect(analyser);
                source.connect(audioCtx.destination);
                activeAudio.play();
                
                document.getElementById('player-title').innerText = title;
                document.getElementById('player-sub').innerText = artist;
                if(img) document.getElementById('player-art').innerHTML = `<img src="${img}" class="w-full h-full object-cover rounded-xl">`;
                document.getElementById('player-bar').classList.remove('translate-y-full');
            });
        }

        async function searchSongs() {
            const q = document.getElementById('itunes-q').value;
            if(!q) return;
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=12`);
                const data = await res.json();
                const container = document.getElementById('itunes-results');
                container.innerHTML = "";
                data.results.forEach(song => {
                    const div = document.createElement('div');
                    div.className = "glass p-4 rounded-2xl flex items-center gap-4 cursor-pointer active:bg-slate-700/50";
                    div.onclick = () => playTrack(song.previewUrl, song.trackName, song.artistName, song.artworkUrl100);
                    div.innerHTML = `<img src="${song.artworkUrl60}" class="w-10 h-10 rounded-lg"><div class="flex-1 truncate text-[10px] font-bold"><p class="truncate text-white text-xs">${song.trackName}</p><p class="text-slate-500 uppercase">${song.artistName}</p></div><div class="text-sky-500 font-black">▶</div>`;
                    container.appendChild(div);
                });
            } catch(e) { alert("Suche fehlgeschlagen."); }
        }

        async function toggleMic() {
            const btn = document.getElementById('mic-toggle');
            if (isMicRunning) {
                if (micStream) micStream.getTracks().forEach(t => t.stop());
                isMicRunning = false;
                btn.innerText = "Start";
                btn.classList.replace('bg-red-500', 'bg-sky-500');
            } else {
                await initAudio();
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioCtx.createMediaStreamSource(micStream);
                    source.connect(analyser);
                    isMicRunning = true;
                    btn.innerText = "Stopp";
                    btn.classList.add('bg-red-500');
                } catch(e) { alert("Kein Mikrofon-Zugriff."); }
            }
        }

        // Tap Button Logik (Handy + Maus)
        const tapBtn = document.getElementById('tap-btn');
        tapBtn.addEventListener('touchstart', (e) => { e.preventDefault(); processBeat(); });
        tapBtn.addEventListener('mousedown', (e) => { if (!('ontouchstart' in window)) processBeat(); });

        document.getElementById('mic-toggle').addEventListener('click', toggleMic);
        document.getElementById('stop-btn').addEventListener('click', () => {
            if (activeAudio) activeAudio.pause();
            if (isMicRunning) toggleMic();
            document.getElementById('player-bar').classList.add('translate-y-full');
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const url = URL.createObjectURL(file);
                playTrack(url, file.name, "Eigene Datei");
            }
        });

    </script>
</body>
</html>
