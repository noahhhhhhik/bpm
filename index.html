<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BPM Counter Pro</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 3px solid #0ea5e9; color: #0ea5e9; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input[type=range] { accent-color: #0ea5e9; }
        .bpm-glow { text-shadow: 0 0 15px rgba(14, 165, 233, 0.7); }
    </style>
</head>
<body class="p-4 pb-32 select-none">

    <div class="max-w-xl mx-auto">
        <!-- Top Bar -->
        <header class="flex justify-between items-end mb-8 pt-6">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter uppercase">BPM<span class="text-sky-500">PRO</span></h1>
                <p id="status-text" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Bereit</p>
            </div>
            <div id="bpm-display" class="text-6xl font-mono font-black text-sky-400 bpm-glow">0</div>
        </header>

        <!-- Tabs Navigation -->
        <nav class="flex border-b border-slate-800 mb-8 text-[11px] font-bold uppercase">
            <button onclick="openTab(event, 'tap')" class="tab-link active-tab flex-1 py-4">Tap & Live</button>
            <button onclick="openTab(event, 'file')" class="tab-link flex-1 py-4">Dateien</button>
            <button onclick="openTab(event, 'search')" class="tab-link flex-1 py-4">Suche</button>
        </nav>

        <!-- TAB 1: TAP & MIC -->
        <div id="tap" class="tab-content active space-y-6">
            <div class="text-center">
                <button id="tap-btn" class="w-full py-20 glass rounded-[3rem] text-7xl font-black active:scale-95 transition-all border-2 border-slate-700/50">TAP</button>
                <button onclick="resetBpm()" class="mt-6 text-slate-500 hover:text-sky-400 text-[10px] font-bold uppercase tracking-widest">✕ Zähler Reset</button>
            </div>
            
            <div class="glass p-6 rounded-[2rem] border border-slate-700">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Auto-Bass Erkennung</span>
                    <button id="mic-toggle" class="bg-sky-500 text-slate-900 px-6 py-2 rounded-full text-[10px] font-black uppercase">Mikro Start</button>
                </div>
                <input type="range" id="sensitivity" min="10" max="100" value="60" class="w-full h-2 bg-slate-900 rounded-lg appearance-none">
            </div>
        </div>

        <!-- TAB 2: FILES -->
        <div id="file" class="tab-content space-y-4">
            <div class="glass p-10 rounded-[2rem] border-dashed border-2 border-slate-700 text-center">
                <input type="file" id="file-input" accept="audio/*" class="hidden">
                <label for="file-input" class="cursor-pointer block">
                    <div class="text-4xl mb-4">📂</div>
                    <p class="font-bold text-sm text-slate-300">Musikdatei laden</p>
                </label>
            </div>
            <div id="file-list" class="space-y-2"></div>
        </div>

        <!-- TAB 3: SEARCH -->
        <div id="search" class="tab-content space-y-4">
            <div class="flex gap-2">
                <input type="text" id="itunes-q" placeholder="Song suchen..." class="flex-1 bg-slate-800 p-4 rounded-2xl focus:outline-none border border-slate-700 text-sm">
                <button id="itunes-search-btn" class="bg-sky-500 text-slate-900 px-6 rounded-2xl font-black text-xs uppercase">Go</button>
            </div>
            <div id="itunes-results" class="space-y-2"></div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div id="player-bar" class="fixed bottom-0 left-0 right-0 glass border-t border-slate-700 p-5 translate-y-full transition-transform duration-300 z-50 rounded-t-[2rem]">
        <div class="max-w-xl mx-auto flex items-center gap-4">
            <div id="player-art" class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-xl">🎵</div>
            <div class="flex-1 min-w-0">
                <p id="player-title" class="font-bold text-sm truncate">Titel</p>
                <p id="player-sub" class="text-[10px] text-slate-500 uppercase font-bold truncate">Künstler</p>
            </div>
            <button id="stop-btn" class="bg-red-500/20 text-red-500 px-6 py-3 rounded-xl font-black text-[10px] uppercase">STOP</button>
        </div>
    </div>

    <script>
        let taps = [];
        let audioCtx = null;
        let analyser = null;
        let activeAudio = null;
        let isMicRunning = false;
        let micStream = null;

        // TABS FIX: Event korrekt übergeben
        function openTab(evt, name) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            
            const links = document.getElementsByClassName("tab-link");
            for (let i = 0; i < links.length; i++) links[i].classList.remove("active-tab");
            
            document.getElementById(name).style.display = "block";
            evt.currentTarget.classList.add("active-tab");
        }

        // BPM RECHNUNG
        function processBeat() {
            const now = Date.now();
            if (taps.length > 0 && now - taps[taps.length-1] > 2200) taps = [];
            taps.push(now);
            if (taps.length > 1) {
                const avg = (taps[taps.length-1] - taps[0]) / (taps.length-1);
                document.getElementById('bpm-display').innerText = Math.round(60000 / avg);
            }
        }

        function resetBpm() {
            taps = [];
            document.getElementById('bpm-display').innerText = "0";
        }

        // AUDIO ENGINE
        async function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            if (!analyser) {
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 150; 
                filter.connect(analyser);
                
                const data = new Uint8Array(analyser.frequencyBinCount);
                let lastBeat = 0;

                function loop() {
                    analyser.getByteFrequencyData(data);
                    let volume = data[1] + data[2] + data[3];
                    let sens = document.getElementById('sensitivity').value;
                    let threshold = 255 - (sens * 2);

                    if (volume > threshold) {
                        const now = Date.now();
                        if (now - lastBeat > 280) { 
                            processBeat();
                            lastBeat = now;
                        }
                    }
                    requestAnimationFrame(loop);
                }
                loop();
            }
        }

        // PLAY & STOP
        function playTrack(url, title, artist, img = null) {
            initAudio().then(() => {
                if (activeAudio) activeAudio.pause();
                activeAudio = new Audio();
                activeAudio.crossOrigin = "anonymous";
                activeAudio.src = url;

                const source = audioCtx.createMediaElementSource(activeAudio);
                source.connect(analyser);
                source.connect(audioCtx.destination);

                activeAudio.play();
                
                document.getElementById('player-title').innerText = title;
                document.getElementById('player-sub').innerText = artist;
                if(img) document.getElementById('player-art').innerHTML = `<img src="${img}" class="w-full h-full object-cover rounded-xl">`;
                document.getElementById('player-bar').classList.remove('translate-y-full');
            });
        }

        function stopCurrent() {
            if (activeAudio) activeAudio.pause();
            if (isMicRunning) stopMic();
            document.getElementById('player-bar').classList.add('translate-y-full');
        }

        // SUCHE
        async function searchSongs() {
            const q = document.getElementById('itunes-q').value;
            if(!q) return;
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=15`);
            const data = await res.json();
            const container = document.getElementById('itunes-results');
            container.innerHTML = "";
            
            data.results.forEach(song => {
                const div = document.createElement('div');
                div.className = "glass p-4 rounded-2xl flex items-center gap-4 cursor-pointer";
                div.onclick = () => { playTrack(song.previewUrl, song.trackName, song.artistName, song.artworkUrl100); };
                div.innerHTML = `
                    <img src="${song.artworkUrl60}" class="w-10 h-10 rounded-lg">
                    <div class="flex-1 truncate text-xs"><p class="font-bold truncate">${song.trackName}</p><p class="text-slate-500 uppercase">${song.artistName}</p></div>
                    <div class="text-sky-500">▶</div>
                `;
                container.appendChild(div);
            });
        }

        // MIKRO
        async function startMic() {
            await initAudio();
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioCtx.createMediaStreamSource(micStream);
            source.connect(analyser);
            isMicRunning = true;
            document.getElementById('mic-toggle').innerText = "Stopp";
            document.getElementById('mic-toggle').classList.replace('bg-sky-500', 'bg-red-500');
        }

        function stopMic() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            isMicRunning = false;
            document.getElementById('mic-toggle').innerText = "Mikro Start";
            document.getElementById('mic-toggle').classList.replace('bg-red-500', 'bg-sky-500');
        }

        // LISTENERS
        document.getElementById('tap-btn').addEventListener('touchstart', (e) => { e.preventDefault(); processBeat(); });
        document.getElementById('tap-btn').addEventListener('mousedown', (e) => { processBeat(); });
        document.getElementById('itunes-search-btn').addEventListener('click', searchSongs);
        document.getElementById('stop-btn').addEventListener('click', stopCurrent);
        document.getElementById('mic-toggle').addEventListener('click', () => isMicRunning ? stopMic() : startMic());
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            playTrack(url, file.name, "Lokale Datei");
        });
    </script>
</body>
</html>
